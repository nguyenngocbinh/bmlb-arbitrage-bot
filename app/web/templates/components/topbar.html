<header class="topbar">
    <div class="breadcrumb"><a href="/dashboard">Overview</a><span>/</span><strong>{% block breadcrumb %}Dashboard{% endblock %}</strong></div>
    <div class="topbar-search" role="search"><span class="search-icon">⌕</span><span>Search markets, exchanges, pairs...</span><kbd>⌘ K</kbd></div>
    <div class="topbar-actions">
        <span class="status-pill"><i></i>{{ bot_status|default('IDLE') }}</span>
        <button class="top-action" type="button" aria-label="Theme">☼</button>
        <button class="top-action" type="button" aria-label="Notifications">♧</button>
        <button class="top-action" type="button" aria-label="Documentation">▥</button>
        <span class="avatar">NB</span>
    </div>
</header>
