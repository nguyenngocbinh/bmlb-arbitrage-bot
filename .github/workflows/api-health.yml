name: Daily Exchange API Health

on:
  schedule:
    - cron: "17 2 * * *" # Daily at 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API client
        run: python -m pip install --disable-pip-version-check "ccxt>=4.0.3"
      - name: Check public exchange APIs (read-only)
        run: python -m monitoring.api_health
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-health-report
          path: api-health-report.json
          if-no-files-found: ignore
          retention-days: 30
